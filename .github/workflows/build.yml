name: Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android is currently broken (it tries to install
      # the removed "tools" package), so use the SDK that ships with the runner.
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "platforms:"; ls "$SDK_ROOT/platforms" || true
          echo "build-tools:"; ls "$SDK_ROOT/build-tools" || true

      - name: Build plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace --no-daemon

      - name: Collect build output
        run: |
          mkdir -p publish
          cp build/plugins.json publish/plugins.json
          cp icon.png publish/icon.png
          find . -name "*.cs3" -exec cp {} publish/ \;
          ls -la publish

      - name: Generate repo.json
        run: |
          python3 - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
              "name": "Arabic Anime",
              "description": "WitAnime + Anime4Up + EgyDead - Arabic anime, movies and series for CloudStream",
              "iconUrl": f"https://raw.githubusercontent.com/{repo}/builds/icon.png",
              "manifestVersion": 1,
              "pluginLists": [
                  f"https://raw.githubusercontent.com/{repo}/builds/plugins.json"
              ],
          }
          with open("publish/repo.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          PY

      - name: Publish to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: builds
          force_orphan: true
          commit_message: "Build ${{ github.sha }}"
