name: Smoke test

# Manual only: GitHub-hosted runners sit in datacenter ranges that the source
# sites block (Cloudflare bot management), so the checks pass locally but not
# from CI. Run `node tools/smoke-test.mjs` on your own machine instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run provider smoke test
        run: node tools/smoke-test.mjs
